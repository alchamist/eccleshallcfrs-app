<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bleed Kit Check — Eccleshall CFR</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <span class="header-logo"><span class="scheme-name">Eccleshall CFR</span> <span class="callsign">RC0681</span></span>
    <span id="sync-badge" class="sync-indicator"></span>
  </header>

  <main class="main-content">

    <!-- Device info -->
    <div class="card" id="device-info" style="margin-bottom:16px;">
      <div class="loading"><div class="spinner"></div>Loading…</div>
    </div>

    <!-- Check form -->
    <div class="card" id="check-form-card" style="margin-bottom:16px;">
      <p class="card-title">Record Check</p>

      <div class="form-group">
        <label class="form-label">Cabinet accessible? <span class="req">*</span></label>
        <div style="display:flex; gap:16px; margin-top:4px;">
          <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="cabinet-accessible" value="yes" checked onchange="toggleAccessFields()"> Yes</label>
          <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="cabinet-accessible" value="no" onchange="toggleAccessFields()"> No</label>
        </div>
      </div>

      <div id="access-fields">
        <div class="form-group">
          <label class="form-label">Kit present? <span class="req">*</span></label>
          <div style="display:flex; gap:16px; margin-top:4px;">
            <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="kit-present" value="yes" checked> Yes</label>
            <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="kit-present" value="no"> No</label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="kit-expiry">Kit expiry <span class="req">*</span></label>
          <input id="kit-expiry" class="form-input" type="month">
        </div>
      </div>

      <div class="form-group mb-0">
        <label class="form-label" for="check-notes">Notes <span style="color:var(--text-muted);">(optional)</span></label>
        <textarea id="check-notes" class="form-input" rows="2" placeholder="Any additional observations"></textarea>
      </div>

      <hr class="divider">
      <button class="btn btn-primary btn-block" onclick="submitCheck()">Submit Check</button>
      <a href="/defibs.html?tab=bleed-kits" class="btn btn-ghost btn-block" style="margin-top:8px;">Cancel</a>
    </div>

    <!-- Check history -->
    <div class="card" id="history-card">
      <p class="card-title">Recent Checks</p>
      <div id="check-history">
        <div class="loading"><div class="spinner"></div>Loading…</div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script src="/js/app.js"></script>
  <script src="/js/bleed-kit-check.js"></script>
</body>
</html>
