name: Deploy all CFR groups

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      group:
        description: 'Group to deploy (slug, or "all")'
        required: false
        default: 'all'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 91e87a1af94c50755b19f07943df567c

jobs:
  deploy-eccleshall:
    name: Deploy Eccleshall CFRs
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.group == 'all' || github.event.inputs.group == 'eccleshall'
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy to eccleshallcfrs-app
        run: wrangler pages deploy . --project-name eccleshallcfrs-app

  deploy-lichfield:
    name: Deploy Lichfield CFRs
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.group == 'all' || github.event.inputs.group == 'lichfield'
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy to lichfieldcfrs-app
        run: |
          cp wrangler.lichfield.toml wrangler.toml
          wrangler pages deploy . --project-name lichfieldcfrs-app
