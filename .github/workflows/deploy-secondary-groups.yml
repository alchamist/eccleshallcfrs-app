name: Deploy secondary CFR groups

on:
  push:
    branches: [master]

jobs:
  deploy-lichfield:
    name: Deploy Lichfield CFRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to lichfieldcfrs-app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name lichfieldcfrs-app --config wrangler.lichfield.toml
