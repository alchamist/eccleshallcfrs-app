name: Deploy secondary CFR groups

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-lichfield:
    name: Deploy Lichfield CFRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to lichfieldcfrs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cp wrangler.lichfield.toml wrangler.toml
          wrangler pages deploy . --project-name lichfieldcfrs-app
